name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest ruff
      # The firewall runs before the tests: a layering violation should fail the
      # build even if every test happens to pass. SPEC 3.
      - run: ruff check afc tools tests
      - run: python tools/check_imports.py
      - run: python -m pytest
