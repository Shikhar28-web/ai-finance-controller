[project]
name = "ai-finance-controller"
version = "0.1.0"
description = "Reconciliation engine: Razorpay vs bank statement vs merchant ledger"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
llm = ["anthropic>=0.40"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
